<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BioSynvia — toward lower-intervention bioprocess research</title>
  <desc id="desc">A dark blue and teal banner with a bioreactor and signal paths. Research software for current VCD estimation, forecasting and an eventual digital twin. Modeling is pending approval.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091827"/><stop offset="1" stop-color="#102c3b"/></linearGradient>
    <linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#2dd4bf" stop-opacity=".6"/><stop offset="1" stop-color="#0f766e" stop-opacity=".2"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#78b9c4" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="48" y="44" width="212" height="28" rx="14" fill="#123e46"/>
  <text x="65" y="63" fill="#74f2d6" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">BIOPROCESS RESEARCH</text>
  <text x="48" y="143" fill="#f1fafb" font-family="Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2">BioSynvia</text>
  <text x="50" y="186" fill="#c7e5ea" font-family="Arial,sans-serif" font-size="24">Toward lower-intervention bioprocess research.</text>
  <text x="50" y="222" fill="#91b3bf" font-family="Arial,sans-serif" font-size="17">Monitor cultures. Anticipate change. Explore before intervening.</text>
  <rect x="50" y="266" width="230" height="34" rx="17" fill="#173644" stroke="#30596a"/>
  <text x="67" y="288" fill="#d2e9ef" font-family="Arial,sans-serif" font-size="12" font-weight="700">ENGINEERING CHECKPOINT</text>
  <text x="300" y="288" fill="#f3cb82" font-family="Arial,sans-serif" font-size="13">Model fitting pending approval</text>
  <g transform="translate(828 48)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 45H165V175Q165 201 110 201Q55 201 55 175Z" fill="#102e3a" stroke="#77c9d0" stroke-width="3"/>
    <path d="M58 112Q82 99 110 111T162 112V174Q162 197 110 197Q58 197 58 174Z" fill="url(#fluid)"/>
    <path d="M44 45H177M110 20V174M84 137L110 145L137 137M83 167L110 174L137 167" stroke="#c4e8e7" stroke-width="3"/>
    <path d="M68 20H153M79 203V220M145 203V220M35 82H7M184 82H212" stroke="#648e9f" stroke-width="3"/>
    <path d="M-40 108H4L15 97L25 125L36 110H52M168 108H189L199 87L211 125L222 108H272" stroke="#3de0bf" stroke-width="3"/>
    <circle cx="77" cy="124" r="3" fill="#9cf6db"/><circle cx="144" cy="151" r="4" fill="#9cf6db"/><circle cx="91" cy="176" r="2" fill="#9cf6db"/>
    <circle cx="-40" cy="108" r="5" fill="#3de0bf"/><circle cx="272" cy="108" r="5" fill="#3de0bf"/>
    <path d="M-17 249H236" stroke="#466879" stroke-width="2" stroke-dasharray="4 7"/>
    <circle cx="0" cy="249" r="6" fill="#3de0bf"/><circle cx="109" cy="249" r="6" fill="#3de0bf"/><circle cx="218" cy="249" r="6" fill="#f3cb82"/>
