[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosynvia"
version = "0.1.0"
description = "Reproducible offline bioprocess data auditing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
biosynvia = "biosynvia.cli:main"

[tool.setuptools.packages.find]
include = ["biosynvia*"]
